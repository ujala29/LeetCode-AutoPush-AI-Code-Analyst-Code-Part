name: Daily motivation emails

on:
  schedule:
    - cron: '30 3 * * *'  # 9:00 AM IST (03:30 UTC)
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Wake backend and send emails
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --retry 3 --retry-delay 10 \
            https://leetcode-ai-backend.onrender.com/api/trigger-emails
