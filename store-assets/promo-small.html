<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 440px; height: 280px; overflow: hidden;
    background: #0d1117;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Grid dots background */
  body::before {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, #2d2d44 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.4;
  }

  /* Glow */
  .glow {
    position: absolute;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(108,99,255,0.2) 0%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
  }

  .content {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }

  .icon-wrap {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, #6c63ff, #a855f7);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    box-shadow: 0 8px 30px rgba(108,99,255,0.5);
  }

  .name {
    font-size: 20px; font-weight: 800;
    background: linear-gradient(135deg, #fff 30%, #a5a0ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    line-height: 1.1;
  }

  .tagline {
    font-size: 12px; color: #8b8b8b;
    letter-spacing: 0.3px;
  }

  .badges {
    display: flex; gap: 8px;
  }
  .badge {
    padding: 4px 12px; border-radius: 20px;
    font-size: 10px; font-weight: 600;
    border: 1px solid;
  }
  .b1 { background: rgba(108,99,255,0.15); border-color: rgba(108,99,255,0.4); color: #a5a0ff; }
  .b2 { background: rgba(44,186,0,0.12); border-color: rgba(44,186,0,0.4); color: #2cba00; }
  .b3 { background: rgba(255,161,22,0.12); border-color: rgba(255,161,22,0.4); color: #ffa116; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="content">
    <div class="icon-wrap">📓</div>
    <div class="name">LeetCode AI Journal</div>
    <div class="tagline">Solve → Analyze → Commit. Automatically.</div>
    <div class="badges">
      <div class="badge b1">🤖 Groq AI</div>
      <div class="badge b2">GitHub</div>
      <div class="badge b3">Daily Streaks</div>
    </div>
  </div>
</body>
</html>
